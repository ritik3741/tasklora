name: Production Build & QA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run Type Check
      run: npx tsc --noEmit

    - name: Production Build
      run: npm run build
      env:
        # Pass mock variables to ensure the build passes
        NEXT_PUBLIC_SITE_URL: "https://tasklora.com"
